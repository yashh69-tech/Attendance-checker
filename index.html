<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Virtual Cigarette AR Lounge</title>

  <!-- MediaPipe Face Mesh CDN -->
  <script src="https://cdn.jsdelivr.net/npm/@mediapipe/camera_utils/camera_utils.js" crossorigin="anonymous"></script>
  <script src="https://cdn.jsdelivr.net/npm/@mediapipe/face_mesh/face_mesh.js" crossorigin="anonymous"></script>

  <style>
    * {
      box-sizing: border-box;
      margin: 0;
      padding: 0;
      font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif;
    }

    body {
      background-color: #0b0b0f;
      color: #ffffff;
      overflow: hidden;
      width: 100vw;
      height: 100vh;
      display: flex;
      align-items: center;
      justify-content: center;
    }

    #container {
      position: relative;
      width: 100vw;
      height: 100vh;
      overflow: hidden;
    }

    /* Webcam Feed (Mirrored) */
    #webcam {
      position: absolute;
      top: 50%;
      left: 50%;
      transform: translate(-50%, -50%) scaleX(-1);
      min-width: 100%;
      min-height: 100%;
      object-fit: cover;
      z-index: 1;
    }

    /* AR Overlay Canvas */
    #output-canvas {
      position: absolute;
      top: 0;
      left: 0;
      width: 100vw;
      height: 100vh;
      z-index: 2;
      pointer-events: none;
    }

    /* UI Header Overlay */
    .top-bar {
      position: absolute;
      top: 18px;
      left: 20px;
      right: 20px;
      display: flex;
      justify-content: space-between;
      align-items: center;
      z-index: 10;
      pointer-events: auto;
    }

    .brand-title {
      background: rgba(15, 15, 20, 0.65);
      backdrop-filter: blur(12px);
      padding: 10px 18px;
      border-radius: 24px;
      font-size: 14px;
      letter-spacing: 1px;
      text-transform: uppercase;
      font-weight: 700;
      border: 1px solid rgba(255, 255, 255, 0.15);
    }

    /* Bottom Brand Selector */
    .selector-bar {
      position: absolute;
      bottom: 25px;
      left: 50%;
      transform: translateX(-50%);
      z-index: 10;
      display: flex;
      gap: 12px;
      background: rgba(15, 15, 20, 0.75);
      backdrop-filter: blur(16px);
      padding: 10px 16px;
      border-radius: 40px;
      border: 1px solid rgba(255, 255, 255, 0.15);
      max-width: 90vw;
      overflow-x: auto;
      scrollbar-width: none;
    }

    .selector-bar::-webkit-scrollbar {
      display: none;
    }

    .brand-btn {
      background: transparent;
      border: 1px solid rgba(255, 255, 255, 0.2);
      color: #e5e5e5;
      padding: 8px 16px;
      border-radius: 20px;
      font-size: 13px;
      font-weight: 600;
      cursor: pointer;
      white-space: nowrap;
      transition: all 0.2s ease;
    }

    .brand-btn:hover {
      background: rgba(255, 255, 255, 0.15);
    }

    .brand-btn.active {
      background: #ffffff;
      color: #000000;
      border-color: #ffffff;
      box-shadow: 0 0 12px rgba(255, 255, 255, 0.4);
    }

    #loading-indicator {
      position: absolute;
      top: 50%;
      left: 50%;
      transform: translate(-50%, -50%);
      background: rgba(0, 0, 0, 0.8);
      padding: 16px 24px;
      border-radius: 12px;
      font-size: 15px;
      z-index: 20;
    }
  </style>
</head>
<body>

  <div id="container">
    <div id="loading-indicator">Initializing Camera & AR Tracking...</div>

    <!-- Live Video Feed -->
    <video id="webcam" playsinline autoplay muted></video>

    <!-- AR Canvas -->
    <canvas id="output-canvas"></canvas>

    <!-- Header Overlay -->
    <div class="top-bar">
      <div class="brand-title">Cigarette Lounge AR</div>
    </div>

    <!-- Cigarette Brand Selection Menu -->
    <div class="selector-bar" id="brand-selector">
      <button class="brand-btn active" data-type="marlboro">Marlboro Red</button>
      <button class="brand-btn" data-type="classic">Classic Regular</button>
      <button class="brand-btn" data-type="goldflake">Gold Flake Kings</button>
      <button class="brand-btn" data-type="menthol">Ice Blast / Click</button>
      <button class="brand-btn" data-type="black">Djarum Black</button>
      <button class="brand-btn" data-type="slims">Esse Lights (Slim)</button>
    </div>
  </div>

  <script>
    const videoElement = document.getElementById('webcam');
    const canvasElement = document.getElementById('output-canvas');
    const canvasCtx = canvasElement.getContext('2d');
    const loadingIndicator = document.getElementById('loading-indicator');

    // Brand Styles Configuration
    const CIGARETTE_TYPES = {
      marlboro: { filterColor: '#c27b38', bodyColor: '#f7f7f7', bandColor: '#d62828', length: 110, thickness: 11 },
      classic: { filterColor: '#b87333', bodyColor: '#f5f5f5', bandColor: '#003049', length: 115, thickness: 12 },
      goldflake: { filterColor: '#c58b44', bodyColor: '#ffffff', bandColor: '#d4af37', length: 120, thickness: 12 },
      menthol: { filterColor: '#2b9348', bodyColor: '#e9f5ed', bandColor: '#0077b6', length: 110, thickness: 11 },
      black: { filterColor: '#1a1a1a', bodyColor: '#121212', bandColor: '#c49b63', length: 110, thickness: 11 },
      slims: { filterColor: '#fdfdfd', bodyColor: '#f2f2f2', bandColor: '#90e0ef', length: 130, thickness: 7 }
    };

    let currentCigarette = CIGARETTE_TYPES.marlboro;
    let smokeParticles = [];

    // Switch Brand Buttons
    document.querySelectorAll('.brand-btn').forEach(btn => {
      btn.addEventListener('click', (e) => {
        document.querySelectorAll('.brand-btn').forEach(b => b.classList.remove('active'));
        e.target.classList.add('active');
        const selected = e.target.getAttribute('data-type');
        currentCigarette = CIGARETTE_TYPES[selected];
      });
    });

    // Resize Canvas to Screen Match
    function resizeCanvas() {
      canvasElement.width = window.innerWidth;
      canvasElement.height = window.innerHeight;
    }
    window.addEventListener('resize', resizeCanvas);
    resizeCanvas();

    // Smoke Particle Logic
    function updateAndDrawSmoke(tipX, tipY) {
      if (Math.random() < 0.6) {
        smokeParticles.push({
          x: tipX + (Math.random() - 0.5) * 4,
          y: tipY,
          vx: (Math.random() - 0.5) * 1.2,
          vy: -(Math.random() * 1.8 + 1.2),
          radius: Math.random() * 3 + 2,
          alpha: 0.6,
          life: 0
        });
      }

      for (let i = smokeParticles.length - 1; i >= 0; i--) {
        let p = smokeParticles[i];
        p.x += p.vx;
        p.y += p.vy;
        p.radius += 0.45;
        p.alpha -= 0.007;
        p.life++;

        canvasCtx.save();
        canvasCtx.beginPath();
        canvasCtx.arc(p.x, p.y, p.radius, 0, 2 * Math.PI);
        canvasCtx.fillStyle = `rgba(220, 220, 220, ${Math.max(p.alpha, 0)})`;
        canvasCtx.fill();
        canvasCtx.restore();

        if (p.alpha <= 0 || p.life > 90) {
          smokeParticles.splice(i, 1);
        }
      }
    }

    // MediaPipe FaceMesh Output Callback
    function onFaceResults(results) {
      if (loadingIndicator.style.display !== 'none') {
        loadingIndicator.style.display = 'none';
      }

      canvasCtx.clearRect(0, 0, canvasElement.width, canvasElement.height);

      if (results.multiFaceLandmarks && results.multiFaceLandmarks.length > 0) {
        const landmarks = results.multiFaceLandmarks[0];

        // Key Lip Landmarks
        const lipCenter = landmarks[13]; // Inner Upper Lip
        const lipRight = landmarks[291]; // User's Left Lip Corner (Mirrored coordinate)
        const lipLeft = landmarks[61];   // User's Right Lip Corner

        // Convert Normalized Coordinates to Mirrored Screen Coordinates
        const mouthX = (1 - lipCenter.x) * canvasElement.width;
        const mouthY = lipCenter.y * canvasElement.height;

        // Angle Calculation based on Lip orientation
        const deltaX = ((1 - lipRight.x) - (1 - lipLeft.x)) * canvasElement.width;
        const deltaY = (lipRight.y - lipLeft.y) * canvasElement.height;
        const faceAngle = Math.atan2(deltaY, deltaX);

        // Fixed downward angle for cigarette placement
        const cigaretteAngle = faceAngle + (25 * Math.PI / 180);

        canvasCtx.save();
        canvasCtx.translate(mouthX, mouthY);
        canvasCtx.rotate(cigaretteAngle);

        const len = currentCigarette.length;
        const thick = currentCigarette.thickness;
        const filterLen = len * 0.3;

        // 1. Filter section (Mouth side)
        canvasCtx.fillStyle = currentCigarette.filterColor;
        canvasCtx.fillRect(-5, -thick / 2, filterLen, thick);

        // 2. Ring / Accent Band
        canvasCtx.fillStyle = currentCigarette.bandColor;
        canvasCtx.fillRect(filterLen - 5, -thick / 2, 4, thick);

        // 3. Paper Body
        canvasCtx.fillStyle = currentCigarette.bodyColor;
        canvasCtx.fillRect(filterLen - 1, -thick / 2, len - filterLen, thick);

        // 4. Burning Ember Tip
        const emberX = len - 1;
        canvasCtx.fillStyle = '#ff3700';
        canvasCtx.fillRect(emberX, -thick / 2, 5, thick);

        // 5. Ash Tip
        canvasCtx.fillStyle = '#4a4a4a';
        canvasCtx.fillRect(emberX + 5, -thick / 2 + 1, 3, thick - 2);

        canvasCtx.restore();

        // Calculate Burning Tip World Position for Smoke
        const tipDistance = len + 6;
        const tipWorldX = mouthX + Math.cos(cigaretteAngle) * tipDistance;
        const tipWorldY = mouthY + Math.sin(cigaretteAngle) * tipDistance;

        updateAndDrawSmoke(tipWorldX, tipWorldY);
      }
    }

    // MediaPipe Setup
    const faceMesh = new FaceMesh({
      locateFile: (file) => `https://cdn.jsdelivr.net/npm/@mediapipe/face_mesh/${file}`
    });

    faceMesh.setOptions({
      maxNumFaces: 1,
      refineLandmarks: true,
      minDetectionConfidence: 0.5,
      minTrackingConfidence: 0.5
    });

    faceMesh.onResults(onFaceResults);

    // Start Camera Stream
    const camera = new Camera(videoElement, {
      onFrame: async () => {
        await faceMesh.send({ image: videoElement });
      },
      width: 1280,
      height: 720
    });

    camera.start();
  </script>
</body>
</html>
