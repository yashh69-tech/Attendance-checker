<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Target Tracker // Confidence Booster</title>

  <!-- MediaPipe -->
  <script src="https://cdn.jsdelivr.net/npm/@mediapipe/face_mesh/face_mesh.js" crossorigin="anonymous"></script>
  <script src="https://cdn.jsdelivr.net/npm/@mediapipe/hands/hands.js" crossorigin="anonymous"></script>

  <style>
    :root {
      --neon-green: #00ff73;
      --neon-red: #ff0055;
      --bg-dark: #07080b;
      --panel-bg: rgba(14, 17, 24, 0.9);
    }

    * {
      box-sizing: border-box;
      margin: 0;
      padding: 0;
      user-select: none;
    }

    body {
      background: var(--bg-dark);
      color: var(--neon-green);
      font-family: 'Courier New', monospace;
      min-height: 100vh;
      display: flex;
      flex-direction: column;
      align-items: center;
      padding: 12px;
      overflow-x: hidden;
    }

    /* Sci-Fi Scanlines */
    body::before {
      content: " ";
      position: fixed;
      top: 0; left: 0; bottom: 0; right: 0;
      background: linear-gradient(rgba(18, 16, 16, 0) 50%, rgba(0, 0, 0, 0.35) 50%);
      background-size: 100% 3px;
      z-index: 99;
      pointer-events: none;
    }

    header {
      width: 100%;
      max-width: 1100px;
      display: flex;
      justify-content: space-between;
      align-items: center;
      padding: 10px 18px;
      border: 1px solid rgba(0, 255, 115, 0.3);
      background: var(--panel-bg);
      border-radius: 6px;
      margin-bottom: 12px;
    }

    .title {
      font-size: 1rem;
      letter-spacing: 2px;
      font-weight: 900;
      text-shadow: 0 0 10px var(--neon-green);
    }

    /* Screen Dual Layout */
    .viewport-grid {
      display: grid;
      grid-template-columns: 1fr 1fr;
      gap: 15px;
      width: 100%;
      max-width: 1100px;
      height: 480px;
      position: relative;
    }

    .monitor-box {
      position: relative;
      background: #000;
      border: 2px solid var(--neon-green);
      border-radius: 8px;
      overflow: hidden;
      box-shadow: 0 0 20px rgba(0, 255, 115, 0.15);
      transition: all 0.2s ease;
    }

    /* Left Monitor: Live Tracking */
    #webcamVideo {
      position: absolute;
      top: 0; left: 0;
      width: 100%; height: 100%;
      object-fit: cover;
      transform: scaleX(-1);
    }

    #hudCanvas {
      position: absolute;
      top: 0; left: 0;
      width: 100%; height: 100%;
      z-index: 10;
      transform: scaleX(-1);
      pointer-events: none;
    }

    /* Right Monitor: Mogged / Sigma Clone Stream */
    #rightCanvas {
      width: 100%; height: 100%;
      object-fit: cover;
      transform: scaleX(-1);
      filter: grayscale(100%) contrast(180%) brightness(85%);
      transition: filter 0.15s;
    }

    /* Mogged State (Red glow & Screen shake) */
    .viewport-grid.mog-active .monitor-box {
      border-color: var(--neon-red) !important;
      box-shadow: 0 0 40px rgba(255, 0, 85, 0.6) !important;
    }

    .viewport-grid.mog-active #rightCanvas {
      filter: grayscale(100%) contrast(280%) brightness(95%) invert(10%);
      animation: phonkPulse 0.4s infinite alternate ease-in-out;
    }

    @keyframes phonkPulse {
      0% { transform: scaleX(-1) scale(1); }
      100% { transform: scaleX(-1) scale(1.04); }
    }

    .mog-badge {
      position: absolute;
      top: 15px;
      right: 15px;
      background: var(--neon-red);
      color: #fff;
      padding: 5px 12px;
      font-weight: 900;
      font-size: 1.1rem;
      letter-spacing: 2px;
      display: none;
      z-index: 20;
      box-shadow: 0 0 15px var(--neon-red);
    }

    /* Standby overlay on right box */
    .standby-overlay {
      position: absolute;
      inset: 0;
      display: flex;
      flex-direction: column;
      align-items: center;
      justify-content: center;
      background: rgba(0, 0, 0, 0.7);
      color: rgba(0, 255, 115, 0.7);
      font-size: 0.9rem;
      z-index: 15;
    }

    .radar {
      width: 60px; height: 60px;
      border: 2px solid var(--neon-green);
      border-radius: 50%;
      margin-bottom: 12px;
      animation: spin 3s linear infinite;
      position: relative;
    }
    .radar::after {
      content: '';
      position: absolute;
      top: 0; left: 50%; width: 50%; height: 50%;
      background: linear-gradient(45deg, rgba(0,255,115,0.4), transparent);
      transform-origin: 0% 100%;
    }
    @keyframes spin { 100% { transform: rotate(360deg); } }

    /* Controls Panel */
    .controls {
      width: 100%;
      max-width: 1100px;
      background: var(--panel-bg);
      border: 1px solid rgba(0, 255, 115, 0.3);
      border-radius: 6px;
      padding: 10px 18px;
      margin-top: 12px;
      display: flex;
      flex-wrap: wrap;
      gap: 15px;
      align-items: center;
      justify-content: space-between;
    }

    .stat-pill {
      font-size: 0.85rem;
    }
    .pill-value {
      color: #fff;
      font-weight: bold;
    }

    .btn-group {
      display: flex;
      gap: 10px;
    }

    button {
      background: #10141c;
      border: 1px solid var(--neon-green);
      color: var(--neon-green);
      padding: 8px 14px;
      font-family: inherit;
      font-size: 0.85rem;
      cursor: pointer;
      font-weight: bold;
      border-radius: 4px;
      transition: all 0.2s;
    }
    button:hover {
      background: var(--neon-green);
      color: #000;
    }
    button.danger {
      border-color: var(--neon-red);
      color: var(--neon-red);
    }
    button.danger:hover {
      background: var(--neon-red);
      color: #fff;
    }
  </style>
</head>
<body>

  <header>
    <div class="title">⚡ TARGET TRACKER // CONFIDENCE BOOSTER</div>
    <div class="stat-pill">SYSTEM: <span class="pill-value" id="systemState">STARTING...</span></div>
  </header>

  <div class="viewport-grid" id="gridContainer">
    <!-- Left Monitor: Realtime Face Wireframe Track -->
    <div class="monitor-box" id="leftBox">
      <video id="webcamVideo" autoplay playsinline muted></video>
      <canvas id="hudCanvas"></canvas>
    </div>

    <!-- Right Monitor: Mogged / Sigma Clone Stream (Exactly like reference video) -->
    <div class="monitor-box" id="rightBox">
      <div class="mog-badge" id="mogBadge">MOGGED</div>
      <canvas id="rightCanvas"></canvas>
      <div class="standby-overlay" id="standbyOverlay">
        <div class="radar"></div>
        <div>[ STANDBY ]</div>
        <small style="font-size: 11px; margin-top: 5px;">HAIR TOUCH OR HEAD TURN TO TRIGGER</small>
      </div>
    </div>
  </div>

  <div class="controls">
    <div class="stat-pill">TRIGGER: <span class="pill-value" id="activeTrigger">NONE</span></div>
    <div class="stat-pill">HAIR HAND: <span class="pill-value" id="hairStatus">NO</span></div>
    <div class="stat-pill">HEAD TURN: <span class="pill-value" id="yawStatus">CENTERED</span></div>
    
    <div class="btn-group">
      <button id="audioEnableBtn">🔊 UNMUTE PHONK</button>
      <button class="danger" id="forceDropBtn">⚡ FORCE DROP</button>
    </div>
  </div>

  <!-- Real Phonk Audio Track (Looping Bass drop) -->
  <audio id="phonkAudio" loop preload="auto">
    <source src="https://cdn.freesound.org/previews/612/612610_5674468-lq.mp3" type="audio/mp3">
  </audio>

  <script>
    const webcamVideo = document.getElementById('webcamVideo');
    const hudCanvas = document.getElementById('hudCanvas');
    const hudCtx = hudCanvas.getContext('2d');
    const rightCanvas = document.getElementById('rightCanvas');
    const rightCtx = rightCanvas.getContext('2d');

    const gridContainer = document.getElementById('gridContainer');
    const standbyOverlay = document.getElementById('standbyOverlay');
    const mogBadge = document.getElementById('mogBadge');
    const phonkAudio = document.getElementById('phonkAudio');

    const systemState = document.getElementById('systemState');
    const activeTrigger = document.getElementById('activeTrigger');
    const hairStatus = document.getElementById('hairStatus');
    const yawStatus = document.getElementById('yawStatus');
    const forceDropBtn = document.getElementById('forceDropBtn');
    const audioEnableBtn = document.getElementById('audioEnableBtn');

    let faceMesh = null;
    let hands = null;
    let isMogging = false;
    let handInHair = false;
    let latestForeheadPoint = null;
    let audioAllowed = false;

    // --- Audio Initializer ---
    function unlockAudio() {
      audioAllowed = true;
      audioEnableBtn.innerText = "🔊 PHONK ARMED";
      audioEnableBtn.style.borderColor = "#fff";
      phonkAudio.volume = 0.9;
      // Pre-warm audio on mobile/iPad
      phonkAudio.play().then(() => {
        if (!isMogging) phonkAudio.pause();
      }).catch(()=>{});
    }
    audioEnableBtn.onclick = unlockAudio;

    // --- 3D Wireframe Cyber Box ---
    function draw3DWireframeCube(cx, cy, size, yawAngle, pitchAngle, isTriggered) {
      hudCtx.save();
      hudCtx.translate(cx, cy);

      const color = isTriggered ? '#ff0055' : '#00ff73';
      hudCtx.strokeStyle = color;
      hudCtx.lineWidth = 2.5;

      const s = size * 0.65;
      const d = s * 0.7;
      const ox = yawAngle * 35;
      const oy = pitchAngle * 25;

      const f1 = { x: -s, y: -s };
      const f2 = { x: s, y: -s };
      const f3 = { x: s, y: s };
      const f4 = { x: -s, y: s };

      const b1 = { x: -s + ox, y: -s + oy - d };
      const b2 = { x: s + ox, y: -s + oy - d };
      const b3 = { x: s + ox, y: s + oy - d };
      const b4 = { x: -s + ox, y: s + oy - d };

      // Front
      hudCtx.beginPath();
      hudCtx.moveTo(f1.x, f1.y); hudCtx.lineTo(f2.x, f2.y); hudCtx.lineTo(f3.x, f3.y);
      hudCtx.lineTo(f4.x, f4.y); hudCtx.closePath();
      hudCtx.stroke();

      // Back
      hudCtx.beginPath();
      hudCtx.moveTo(b1.x, b1.y); hudCtx.lineTo(b2.x, b2.y); hudCtx.lineTo(b3.x, b3.y);
      hudCtx.lineTo(b4.x, b4.y); hudCtx.closePath();
      hudCtx.stroke();

      // Connecting corners
      hudCtx.beginPath();
      hudCtx.moveTo(f1.x, f1.y); hudCtx.lineTo(b1.x, b1.y);
      hudCtx.moveTo(f2.x, f2.y); hudCtx.lineTo(b2.x, b2.y);
      hudCtx.moveTo(f3.x, f3.y); hudCtx.lineTo(b3.x, b3.y);
      hudCtx.moveTo(f4.x, f4.y); hudCtx.lineTo(b4.x, b4.y);
      hudCtx.stroke();

      hudCtx.restore();
    }

    // --- State Switching (Mog Mode) ---
    function setMogMode(active, triggerSource = "") {
      if (active && !isMogging) {
        isMogging = true;
        gridContainer.classList.add('mog-active');
        standbyOverlay.style.display = 'none';
        mogBadge.style.display = 'block';
        activeTrigger.innerText = triggerSource || "MANUAL";

        if (audioAllowed) {
          phonkAudio.currentTime = 0;
          phonkAudio.play().catch(()=>{});
        }
      } else if (!active && isMogging) {
        isMogging = false;
        gridContainer.classList.remove('mog-active');
        standbyOverlay.style.display = 'flex';
        mogBadge.style.display = 'none';
        activeTrigger.innerText = "NONE";

        if (audioAllowed) {
          phonkAudio.pause();
        }
      }
    }

    forceDropBtn.onclick = () => {
      unlockAudio();
      setMogMode(!isMogging, "FORCE BUTTON");
    };

    // --- MediaPipe Face Results ---
    function onFaceMeshResults(results) {
      hudCanvas.width = webcamVideo.videoWidth || 640;
      hudCanvas.height = webcamVideo.videoHeight || 480;
      hudCtx.clearRect(0, 0, hudCanvas.width, hudCanvas.height);

      let headTurnTrigger = false;

      if (results.multiFaceLandmarks && results.multiFaceLandmarks.length > 0) {
        const landmarks = results.multiFaceLandmarks[0];

        const nose = landmarks[1];
        const leftCheek = landmarks[234];
        const rightCheek = landmarks[454];
        const chin = landmarks[152];
        const forehead = landmarks[10];

        latestForeheadPoint = { x: forehead.x, y: forehead.y };

        const w = hudCanvas.width;
        const h = hudCanvas.height;

        const cx = nose.x * w;
        const cy = nose.y * h;
        const faceSize = Math.abs(chin.y - forehead.y) * h;

        // Yaw Check
        const distL = Math.abs(nose.x - leftCheek.x);
        const distR = Math.abs(nose.x - rightCheek.x);
        const ratio = distL / (distR + 0.0001);
        const yaw = (ratio - 1.0);

        if (ratio > 2.2) {
          yawStatus.innerText = "RIGHT PROFILE";
          headTurnTrigger = true;
        } else if (ratio < 0.45) {
          yawStatus.innerText = "LEFT PROFILE";
          headTurnTrigger = true;
        } else {
          yawStatus.innerText = "CENTERED";
        }

        draw3DWireframeCube(cx, cy, faceSize, yaw, 0.1, isMogging);
      } else {
        latestForeheadPoint = null;
      }

      if (handInHair) {
        setMogMode(true, "HAIR TOUCH // SIGMA");
      } else if (headTurnTrigger) {
        setMogMode(true, "PROFILE MEWING");
      } else if (activeTrigger.innerText !== "FORCE BUTTON") {
        setMogMode(false);
      }
    }

    // --- MediaPipe Hand Results ---
    function onHandsResults(results) {
      handInHair = false;
      if (results.multiHandLandmarks && results.multiHandLandmarks.length > 0 && latestForeheadPoint) {
        for (const hand of results.multiHandLandmarks) {
          const indexFinger = hand[8];
          const middleFinger = hand[12];

          const distIndex = Math.hypot(indexFinger.x - latestForeheadPoint.x, indexFinger.y - latestForeheadPoint.y);
          const distMiddle = Math.hypot(middleFinger.x - latestForeheadPoint.x, middleFinger.y - latestForeheadPoint.y);

          if (distIndex < 0.22 || distMiddle < 0.22) {
            handInHair = true;
            break;
          }
        }
      }
      hairStatus.innerText = handInHair ? "TOUCHING HAIR" : "NO";
    }

    // --- Continuous Frame Loop & Right Clone Renderer ---
    let isProcessing = false;
    async function processLoop() {
      if (webcamVideo.readyState >= 2) {
        // Draw Live Clone to Right Side Box
        rightCanvas.width = webcamVideo.videoWidth || 640;
        rightCanvas.height = webcamVideo.videoHeight || 480;
        rightCtx.drawImage(webcamVideo, 0, 0, rightCanvas.width, rightCanvas.height);

        // Run AI Detection
        if (!isProcessing) {
          isProcessing = true;
          try {
            if (faceMesh) await faceMesh.send({ image: webcamVideo });
            if (hands) await hands.send({ image: webcamVideo });
          } catch (e) {
            console.error(e);
          }
          isProcessing = false;
        }
      }
      requestAnimationFrame(processLoop);
    }

    // --- Camera Initializer ---
    async function startCamera() {
      systemState.innerText = "STARTING CAMERA...";
      try {
        const stream = await navigator.mediaDevices.getUserMedia({
          video: { facingMode: "user", width: { ideal: 640 }, height: { ideal: 480 } },
          audio: false
        });

        webcamVideo.srcObject = stream;
        await webcamVideo.play();

        systemState.innerText = "LOADING AI MODELS...";
        initAI();
      } catch (err) {
        systemState.innerText = "CAMERA ERROR";
        alert("Camera allow karo browser settings me!");
      }
    }

    async function initAI() {
      faceMesh = new FaceMesh({
        locateFile: (file) => `https://cdn.jsdelivr.net/npm/@mediapipe/face_mesh/${file}`
      });
      faceMesh.setOptions({
        maxNumFaces: 1,
        refineLandmarks: true,
        minDetectionConfidence: 0.5,
        minTrackingConfidence: 0.5
      });
      faceMesh.onResults(onFaceMeshResults);

      hands = new Hands({
        locateFile: (file) => `https://cdn.jsdelivr.net/npm/@mediapipe/hands/${file}`
      });
      hands.setOptions({
        maxNumHands: 2,
        modelComplexity: 0,
        minDetectionConfidence: 0.5,
        minTrackingConfidence: 0.5
      });
      hands.onResults(onHandsResults);

      systemState.innerText = "ONLINE // READY";
      requestAnimationFrame(processLoop);
    }

    window.addEventListener('DOMContentLoaded', startCamera);
  </script>
</body>
</html>
